name: Sync Upstream & Publish Image

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manually triggerable

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote
        run: git remote add upstream https://github.com/MariaDB/mcp.git

      - name: Fetch Upstream
        run: git fetch upstream

      - name: Check for New Commits
        id: check
        run: |
          NEW_COMMITS=$(git rev-list HEAD..upstream/main --count)
          if [ "$NEW_COMMITS" -gt 0 ]; then
            echo "new_commits=true"  >> "$GITHUB_OUTPUT"
          else
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge & Push Upstream Changes
        if: steps.check.outputs.new_commits == 'true'
        run: |
          git merge upstream/main --no-edit
          git push origin main

      - name: Set Up Docker Buildx
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4.0.0

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Image Metadata
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build & Push Docker Image
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Clean Up Untagged Container Versions
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ github.event.repository.name }}
        run: |
          gh api --paginate "/users/$OWNER/packages/container/$PACKAGE_NAME/versions" \
            --jq '.[] | select(.metadata.container.tags | length == 0) | .id' | \
          while read -r id; do
            gh api --method DELETE "/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$id"
            echo "Deleted untagged version $id"
          done
