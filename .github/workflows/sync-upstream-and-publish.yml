name: Sync Upstream & Publish Image

on:
  schedule:
    - cron: '0 */6 * * *'   # alle 6 Stunden
  workflow_dispatch:          # manuell auslösbar

permissions:
  contents: write
  packages: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Fork
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git konfigurieren
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upstream Remote hinzufügen
        run: git remote add upstream https://github.com/MariaDB/mcp.git

      - name: Upstream fetchen
        run: git fetch upstream

      - name: Auf neue Commits prüfen
        id: check
        run: |
          UPSTREAM_SHA=$(git rev-parse upstream/main)
          LOCAL_SHA=$(git rev-parse HEAD)
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM_SHA" != "$LOCAL_SHA" ]; then
            echo "new_commits=true"  >> "$GITHUB_OUTPUT"
          else
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upstream-Änderungen mergen & pushen
        if: steps.check.outputs.new_commits == 'true'
        run: |
          git merge upstream/main --no-edit
          git push origin main

      - name: Docker Buildx einrichten
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4.0.0

      - name: Bei GitHub Container Registry anmelden
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Metadaten ermitteln
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Docker Image bauen & pushen
        if: steps.check.outputs.new_commits == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
