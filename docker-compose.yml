services:
  mariadb-server:
    image: mariadb:11
    container_name: mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword123
      MARIADB_DATABASE: demo
      MARIADB_USER: user
      MARIADB_PASSWORD: password123
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-p'rootpassword123'"]
      interval: 5s
      timeout: 3s
      retries: 10
  mariadb-mcp:
    # asyncmy wheels crash with SIGILL on native arm64 Docker (Apple Silicon).
    # Build and run as linux/amd64 only.
    platform: linux/amd64
    build:
      context: .
      platforms:
        - linux/amd64
    container_name: mariadb-mcp
    env_file: .env
    ports:
      - "9001:9001"
    depends_on:
      mariadb-server:
        condition: service_healthy
